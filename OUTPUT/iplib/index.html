<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPLIB · 代码 / 规约 / 测试</title>
  <link rel="stylesheet" href="dashboard.css?v=2">
</head>
<body>
  <header class="app-header">
    <div>
      <span class="logo">QCIP</span>
      <strong>代码 · 规约 · 测试</strong>
    </div>
    <div class="header-stats">
      <span><b id="total-cases">—</b> cases</span>
      <span><b id="total-tests">—</b> tests</span>
      <span class="scope">OUTPUT / iplib</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <label class="search">
        <span>⌕</span>
        <input id="search" type="search" placeholder="搜索 case…" autocomplete="off">
      </label>
      <div class="case-list" id="case-list"></div>
      <div class="legend">
        <span><i class="dot complete"></i>当前证据完整</span>
        <span><i class="dot archived"></i>历史结果，待补证据</span>
      </div>
    </aside>

    <main class="workspace" id="workspace">
      <div class="loading">正在读取规约数据…</div>
    </main>
  </div>

  <script src="dashboard-data.js?v=2"></script>
  <script src="dashboard.js?v=2"></script>
</body>
</html>
